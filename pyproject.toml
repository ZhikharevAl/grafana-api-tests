[project]
name = "grafana-api-tests"
version = "0.1.0"
description = "Automated testing of Grafana backend using Python + Pytest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "allure-pytest>=2.15.0",
    "pre-commit>=4.3.0",
    "pydantic>=2.11.0",
    "pylint>=3.3.8",
    "pyright>=1.1.405",
    "pytest>=8.4.0",
    "requests>=2.32.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "api: marks tests as API tests",
    "ui: marks tests as UI tests",
    "smoke: marks smoke tests",
    "regression: marks regression tests",
    "NegativeApi: marks negative API tests",
    "PositiveApi: marks positive API tests",
    "NegativeDashboard: marks negative dashboard tests",
    "sql: marks SQL tests",
]
addopts = "-v -s --tb=short --durations=5 --color=yes"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # one-blank-line-before-class
    "D212",   # multi-line-summary-first-line
    "D100",   # missing-docstring-in-public-module
    "COM812", # missing-trailing-comma
    "ISC001", # single-line-implicit-string-concatenation
    "S105",   # hard-coded password (если используете)
    "S101",   # assert statements
]

fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]

[tool.ruff.lint.isort]
known-third-party = ["fastapi", "uvicorn"]

[tool.ruff.lint.pylint]
max-args = 7
max-returns = 3
max-statements = 50
max-branches = 12

[tool.pyright]
exclude = [".venv", "**/__pycache__"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "missing-docstring",
    "too-few-public-methods",
    "redefined-outer-name",
]

[tool.pylint.FORMAT]
max-line-length = 100
